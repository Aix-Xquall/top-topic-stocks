name: Daily Market Topics

on:
  schedule:
    # 06:00 Asia/Taipei
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve report date
        id: date
        run: echo "report_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Refresh keyword-company samples
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m market_topics samples --days 10 --end-date "${{ steps.date.outputs.report_date }}"

      - name: Backtest and update model weights
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m market_topics backtest --days 5 --end-date "${{ steps.date.outputs.report_date }}"

      - name: Generate report
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m market_topics run --date "${{ steps.date.outputs.report_date }}"

      - name: Commit report outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports config/model_weights.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Daily market topics report ${{ steps.date.outputs.report_date }}"
            git push
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build report URL
        id: report_url
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          echo "url=${base}/reports/${{ steps.date.outputs.report_date }}-market-topics.html" >> "$GITHUB_OUTPUT"

      - name: Send LINE notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          REPORT_URL: ${{ steps.report_url.outputs.url }}
        run: |
          python -m market_topics notify-line \
            --date "${{ steps.date.outputs.report_date }}" \
            --report-url "$REPORT_URL"
